# Octobar: GitHub in your bar via the gh CLI. Fork of raycursive/github-prs.
# Four entries: a headless fetch service (owns all gh calls, publishes shared
# state), a bar widget (PR count + unseen activity, click toggles the panel),
# a develop widget (commits tracked local branches are behind) and a panel
# (activity, then PRs grouped by repo with CI status and review badges).

id = "sn4pe/octobar"
name = "Octobar"
version = "0.1.0"
plugin_api = 43
author = "Sn4pe"
license = "MIT"
dependencies = ["gh", "git", "xdg-open"]
tags = ["bar", "development", "panel", "productivity", "service"]
icon = "git-pull-request"
description = "GitHub pull requests, reviews, comments and mentions in your bar, with desktop notifications and tracked branches, using the gh CLI."

# Each rule is a GitHub search query fragment; the service prefixes it with
# "is:pr is:open" (and "archived:false" unless the rule mentions archived:).
[[setting]]
key = "rules"
type = "string_list"
label_key = "settings.rules.label"
description_key = "settings.rules.description"
default = ["author:@me"]

[[setting]]
key = "excluded_repositories"
type = "string_list"
label_key = "settings.excluded_repositories.label"
description_key = "settings.excluded_repositories.description"
default = []

# Reviewers whose activity is not reported, e.g. CI bots that post as users.
[[setting]]
key = "ignored_authors"
type = "string_list"
label_key = "settings.ignored_authors.label"
description_key = "settings.ignored_authors.description"
default = []

[[setting]]
key = "notify"
type = "bool"
label_key = "settings.notify.label"
description_key = "settings.notify.description"
default = true

# Local path -> branch; the develop widget counts the commits it is behind.
[[setting]]
key = "tracked_branches"
type = "string_map"
label_key = "settings.tracked_branches.label"
description_key = "settings.tracked_branches.description"
default = {}

[[setting]]
key = "refresh_interval"
type = "int"
label_key = "settings.refresh_interval.label"
description_key = "settings.refresh_interval.description"
default = 180
min = 30
max = 3600

# Headless service: runs one gh call per rule, merges + dedupes, publishes to
# the plugin's shared state for the widget and panel.
[[service]]
id = "fetch"
entry = "fetch.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  default = "git-pull-request"

  [[widget.setting]]
  key = "hide_when_zero"
  type = "bool"
  label_key = "settings.hide_when_zero.label"
  description_key = "settings.hide_when_zero.description"
  default = false

[[widget]]
id = "develop"
entry = "develop.luau"

# Open with the bar widget click, or: noctalia msg panel-toggle sn4pe/octobar:panel
[[panel]]
id = "panel"
entry = "panel.luau"
width = 660
height = 640
placement = "attached"
position = "auto"
open_near_click = true
